<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Demo Platform | The Sheraton</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/landing.css">
</head>
<body>
    <div class="ambient-glow glow-top"></div>
    <div class="ambient-glow glow-bottom"></div>

    <main class="landing-container">
        <header class="landing-header">
            <h1 class="landing-title">AI Experiences</h1>
            <p class="landing-subtitle">Select a demonstration below</p>
        </header>

        <div class="demo-grid">
            <!-- Demo 1 Card -->
            <a href="/demo1" class="demo-card demo1-theme">
                <div class="demo-card-content">
                    <div class="demo-icon-wrapper">
                        <svg class="demo-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                            <line x1="12" x2="12" y1="19" y2="22"></line>
                        </svg>
                    </div>
                    <h2 class="demo-title">Voice Ordering Kiosk</h2>
                    <p class="demo-desc">Live conversational AI agent for The Sheraton Restaurant. Features real-time ordering and dynamic UI.</p>
                </div>
            </a>

            <!-- Demo 2 Card -->
            <a href="/demo2" class="demo-card demo2-theme">
                <div class="demo-card-content">
                    <div class="demo-icon-wrapper">
                        <svg class="demo-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
                        </svg>
                    </div>
                    <h2 class="demo-title">Medical Transcript</h2>
                    <p class="demo-desc">Doctor-Patient dialogue with real-time transcription, speaker classification, and keyword extraction.</p>
                </div>
            </a>
        </div>
    </main>
</body>
</html>
